<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Contact Austin Bohlman about a project or collaboration.">
  <title>Contact | Austin Bohlman</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header class="site-header">
    <nav class="nav container" aria-label="Main navigation">
      <a class="logo" href="index.html" aria-label="Austin Bohlman home">AB<span>.</span></a>
      <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="nav-links">
        <span></span><span></span><span></span>
        <span class="sr-only">Open navigation menu</span>
      </button>
      <div class="nav-links" id="nav-links">
        <a href="work.html">Work</a>
        <a href="about.html">About</a>
        <a href="contact.html" aria-current="page">Contact</a>
        <button class="theme-toggle" type="button" aria-label="Switch to dark theme">◐</button>
      </div>
    </nav>
  </header>
  <main>
    <section class="contact section">
      <p class="eyebrow">Have a project in mind?</p>
      <h1>Let's make something<br><em>worth remembering.</em></h1>
      <form class="contact-form" novalidate>
        <label><span>Your name</span><input type="text" name="name" placeholder="Jane Smith" required></label>
        <label><span>Your email</span><input type="email" name="email" placeholder="jane@example.com" required></label>
        <label class="message-field"><span>Tell me a little about it</span><textarea name="message" rows="3" placeholder="I'd love to talk about..." required></textarea></label>
        <button class="button button-primary" type="submit">Send message <span>↗</span></button>
        <p class="form-status" role="status"></p>
      </form>
    </section>
  </main>
  <footer class="footer container">
    <a class="logo" href="index.html" aria-label="Austin Bohlman home">AB<span>.</span></a>
    <p>© <span id="year"></span> Austin Bohlman. Made with intention.</p>
    <div class="social-links"><a href="#" aria-label="Instagram">ig</a><a href="#" aria-label="LinkedIn">in</a><a href="#" aria-label="Dribbble">dr</a></div>
  </footer>
</body>
</html>
